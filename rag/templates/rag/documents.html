{% extends "rag/base.html" %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="card-title mb-4">Documents</h1>

    <form id="load-form" class="mb-3">
      <div class="mb-3 d-flex align-items-center gap-2">
        <input
          type="file"
          id="files"
          name="files"
          multiple
          accept=".txt,text/plain"
          required
          style="display: none;"
        >
        <button type="button" id="file-select-btn" class="btn btn-outline-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          Select files
        </button>
        <span id="file-count" class="text-muted">No files selected</span>
      </div>
      <button type="submit" class="btn btn-primary">Load documents</button>
    </form>

    <button id="clear-btn" class="btn btn-outline-danger mb-3">Clear documents</button>

    <div id="status" class="alert alert-secondary" role="alert" style="display: none;"></div>

    <div class="row mt-4">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Model Configuration</h5>
            <table class="table table-sm">
              <tbody>
                <tr>
                  <th scope="row">LLM Model</th>
                  <td id="llm-model">-</td>
                </tr>
                <tr>
                  <th scope="row">Embedding Model</th>
                  <td id="embed-model">-</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Vector Statistics</h5>
            <p><strong>Total vectors:</strong> <span id="total-vectors">0</span></p>
            <p><strong>Longest vector size:</strong> <span id="longest-vector-size">0</span> characters</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Loaded Documents</h5>
            <ul id="doc-list" class="list-group" style="max-height: 300px; overflow-y: auto;"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const docList = document.getElementById("doc-list");
  const statusEl = document.getElementById("status");
  const fileInput = document.getElementById("files");
  const fileSelectBtn = document.getElementById("file-select-btn");
  const fileCount = document.getElementById("file-count");

  fileSelectBtn.addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const count = fileInput.files.length;
    fileCount.textContent = count === 0 ? "No files selected" : `${count} file${count === 1 ? '' : 's'} selected`;
  });

  async function refreshDocs() {
    const res = await fetch("/api/documents/");
    const data = await res.json();

    docList.innerHTML = "";

    if (!Array.isArray(data.documents)) {
      data.documents = [];
    }

    data.documents.forEach((name) => {
      const li = document.createElement("li");
      li.className = "list-group-item";
      li.textContent = name;
      docList.appendChild(li);
    });

    // Update vector statistics
    const stats = data.vector_stats || {};
    document.getElementById("total-vectors").textContent = stats.total_vectors || 0;
    document.getElementById("longest-vector-size").textContent = stats.longest_vector_size || 0;

    // Update model information
    const modelInfo = data.model_info || {};
    document.getElementById("llm-model").textContent = modelInfo.llm_model || "-";
    document.getElementById("embed-model").textContent = modelInfo.embed_model || "-";
  }

  async function checkAndClearChatHistory() {
    const saved = localStorage.getItem('chatHistory');
    if (!saved) return true;

    const messages = JSON.parse(saved);
    if (messages.length === 0) return true;

    // Show confirmation dialog
    const confirmed = confirm(
      `You have ${messages.length} messages in your chat history.\n\n` +
      "Would you like to save this chat history to a file before loading new documents?\n\n" +
      "Click OK to save the chat history, or Cancel to proceed without saving."
    );

    if (confirmed) {
      try {
        const res = await fetch("/api/chat/export/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ messages }),
        });

        if (res.ok) {
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = res.headers.get('Content-Disposition')?.match(/filename="(.+)"/)?.[1] || 'chat_export.txt';
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        }
      } catch (error) {
        console.error('Failed to export chat:', error);
        alert('Failed to export chat history. Proceeding with document load.');
      }
    }

    // Clear the chat history
    localStorage.removeItem('chatHistory');
    return true;
  }

  document.getElementById("load-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    // Check and handle chat history before loading new documents
    await checkAndClearChatHistory();

    const form = e.target;
    const fd = new FormData(form);
    fd.append("action", "load");

    statusEl.textContent = "Loading...";
    statusEl.style.display = "block";

    const res = await fetch("/api/documents/", {
      method: "POST",
      body: fd,
    });

    const data = await res.json();
    statusEl.textContent = JSON.stringify(data, null, 2);
    statusEl.className = data.loaded && data.loaded.length > 0 ? "alert alert-success" : "alert alert-danger";
    await refreshDocs();
  });

  document.getElementById("clear-btn").addEventListener("click", async () => {
    // Check and handle chat history before clearing documents
    await checkAndClearChatHistory();

    statusEl.textContent = "Clearing...";
    statusEl.style.display = "block";

    const body = new URLSearchParams({
      action: "clear",
    });

    const res = await fetch("/api/documents/", {
      method: "POST",
      body: body,
    });

    const data = await res.json();
    statusEl.textContent = JSON.stringify(data, null, 2);
    statusEl.className = "alert alert-info";
    await refreshDocs();
  });

  refreshDocs();
</script>
{% endblock %}
