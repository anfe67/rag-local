{% extends "rag/base.html" %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body d-flex flex-column" style="max-height: calc(100vh - 100px);">
    <h1 class="card-title mb-3">Chat</h1>

    <div id="chat-history" class="flex-grow-1 overflow-auto mb-3 p-3 bg-light rounded" style="min-height: 150px; max-height: 60vh;">
      <div class="text-muted text-center">Start a conversation by asking a question below</div>
    </div>

    <form id="chat-form" class="mt-auto">
      <div class="input-group">
        <input
          class="form-control"
          id="question"
          name="question"
          placeholder="Ask a question about the loaded documents"
          required
          autocomplete="off"
        >
        <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
      </div>
    </form>
  </div>
</div>

<style>
  .message {
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    max-width: 80%;
  }

  .user-message {
    background-color: #0d6efd;
    color: white;
    margin-left: auto;
  }

  .user-message .message-icon {
    color: white;
  }

  .assistant-message {
    background-color: #f8f9fa;
    color: #212529;
    border: 1px solid #dee2e6;
  }

  .message-content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message-sender {
    font-size: 0.875rem;
    opacity: 1;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
  }
</style>

<script>
  const form = document.getElementById("chat-form");
  const questionInput = document.getElementById("question");
  const chatHistory = document.getElementById("chat-history");
  const sendBtn = document.getElementById("send-btn");
  let messageCount = 0;

  function saveChatHistory() {
    const messages = [];
    chatHistory.querySelectorAll('.message').forEach(msg => {
      const isUser = msg.classList.contains('user-message');
      const content = msg.querySelector('.message-content').textContent;
      const timestamp = msg.querySelector('.message-timestamp')?.textContent;
      messages.push({ content, isUser, timestamp });
    });
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }

  function loadChatHistory() {
    const saved = localStorage.getItem('chatHistory');
    if (saved) {
      const messages = JSON.parse(saved);
      if (messages.length > 0) {
        chatHistory.innerHTML = '';
        messageCount = messages.length;
        messages.forEach(msg => {
          addMessageToDOM(msg.content, msg.isUser, msg.timestamp);
        });
      }
    }
  }

  async function checkDocumentVersion() {
    try {
      const res = await fetch("/api/documents/");
      const data = await res.json();
      const currentDocHash = JSON.stringify(data.documents || []).slice(0, 32);
      const storedDocHash = localStorage.getItem('docHash');

      if (storedDocHash && storedDocHash !== currentDocHash) {
        // Documents have changed, clear chat history
        localStorage.removeItem('chatHistory');
        chatHistory.innerHTML = '<div class="text-muted text-center">Start a conversation by asking a question below</div>';
        messageCount = 0;
      }

      // Store current document hash
      localStorage.setItem('docHash', currentDocHash);
    } catch (error) {
      console.error('Failed to check document version:', error);
    }
  }

  function addMessageToDOM(content, isUser, timestamp = null) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;

    const senderDiv = document.createElement('div');
    senderDiv.className = 'message-sender';
    const iconSpan = document.createElement('span');
    iconSpan.style.fontSize = '1.2rem';
    iconSpan.style.marginRight = '0.25rem';
    iconSpan.style.color = isUser ? 'white' : '#212529';
    iconSpan.innerHTML = isUser ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5m9 0a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>';
    senderDiv.appendChild(iconSpan);
    senderDiv.appendChild(document.createTextNode(isUser ? ' You' : ' Assistant'));

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.textContent = content;

    const timestampDiv = document.createElement('div');
    timestampDiv.className = 'message-timestamp';
    timestampDiv.style.fontSize = '0.75rem';
    timestampDiv.style.color = isUser ? 'rgba(255,255,255,0.7)' : '#6c757d';
    timestampDiv.style.marginTop = '0.25rem';
    timestampDiv.textContent = timestamp || new Date().toLocaleTimeString();

    messageDiv.appendChild(senderDiv);
    messageDiv.appendChild(contentDiv);
    messageDiv.appendChild(timestampDiv);
    chatHistory.appendChild(messageDiv);

    // Scroll to bottom
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  function addMessage(content, isUser) {
    // Remove the placeholder message if it exists
    if (messageCount === 0) {
      chatHistory.innerHTML = '';
    }
    messageCount++;

    addMessageToDOM(content, isUser);
    saveChatHistory();
  }

  function addLoadingMessage() {
    const messageDiv = document.createElement('div');
    messageDiv.id = 'loading-message';
    messageDiv.className = 'message assistant-message';
    const senderDiv = document.createElement('div');
    senderDiv.className = 'message-sender';
    const iconSpan = document.createElement('span');
    iconSpan.style.fontSize = '1.2rem';
    iconSpan.style.marginRight = '0.25rem';
    iconSpan.style.color = '#212529';
    iconSpan.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5m9 0a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>';
    senderDiv.appendChild(iconSpan);
    senderDiv.appendChild(document.createTextNode(' Assistant'));
    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.textContent = 'Thinking...';
    messageDiv.appendChild(senderDiv);
    messageDiv.appendChild(contentDiv);
    chatHistory.appendChild(messageDiv);
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  function removeLoadingMessage() {
    const loadingMessage = document.getElementById('loading-message');
    if (loadingMessage) {
      loadingMessage.remove();
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const question = questionInput.value.trim();
    if (!question) return;

    // Disable input while processing
    questionInput.disabled = true;
    sendBtn.disabled = true;

    // Add user message
    addMessage(question, true);
    questionInput.value = '';

    // Add loading indicator
    addLoadingMessage();

    try {
      const res = await fetch("/api/chat/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ question }),
      });

      const data = await res.json();

      // Remove loading indicator
      removeLoadingMessage();

      // Add assistant response
      if (data.answer) {
        addMessage(data.answer, false);
      } else {
        addMessage(JSON.stringify(data, null, 2), false);
      }
    } catch (error) {
      removeLoadingMessage();
      addMessage(`Error: ${error.message}`, false);
    } finally {
      // Re-enable input
      questionInput.disabled = false;
      sendBtn.disabled = false;
      questionInput.focus();
    }
  });

  // Load chat history on page load
  checkDocumentVersion().then(() => {
    loadChatHistory();
  });
</script>
{% endblock %}
